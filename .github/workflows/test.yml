name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230e36a3d3d4c0a4d2d # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Compile source
        run: python -m compileall -q .
      - name: Run regression tests
        run: python -m unittest -v test_generate.py
      - name: Verify distributable web assets
        run: |
          test -s site/index.html
          test -s site/demo.html
          grep -q 'href="/demo.html"' site/index.html
          grep -q 'Sample data' site/demo.html
          git diff --check
