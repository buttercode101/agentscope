[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope"
version = "0.1.0"
description = "Scan-first supervision dashboard for AI agents (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
habitat = "habitat.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.0,<10", "cryptography>=50.0.1,<51"]
signing = ["cryptography>=50.0.1,<51"]

[tool.setuptools]
py-modules = ["generate", "agentscope_habitat"]

[tool.setuptools.packages.find]
include = ["habitat*"]
